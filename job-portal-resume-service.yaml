server:
  port: 9004
spring:
  application:
    name: job-portal-resume-service
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_resume
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

eureka:
  clinet:
    fetch-registry: true
    register-with-eureka: true
    service-url: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
