server:
  port: 9005
spring:
  application:
    name: job-portal-application-service
  jpa:
    hibernate:
      ddl-auto: create
    show-ddl: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_applications
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true